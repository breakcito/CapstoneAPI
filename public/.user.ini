; Limites de subida de archivos.
;
; El .user.ini se lee en cada request (a diferencia de php.ini que solo
; se lee una vez al arrancar PHP-FPM). Sirve para subir limites de upload
; sin tocar el php.ini global del servidor.
;
; - upload_max_filesize: tamano maximo por archivo.
; - post_max_size: tamano maximo del body del POST (debe ser >= upload_max).
; - memory_limit: holgura para procesar la subida antes de tocar disco.

upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M

; Cantidad maxima de archivos por request (incluye las 20 que ya pone PHP
; por defecto + margen). 50 cubre el peor caso del modulo de requerimiento
; donde se suben varias evidencias mas los adjuntos de detalles.
max_file_uploads = 50
